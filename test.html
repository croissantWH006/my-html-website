<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Digital Administrative Transformation System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Modern Corporate: navy fixed sidebar with icons, white content, teal accents. */
:root{
  --font-body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F2F5F9;--surface:#FFFFFF;--surface-2:#E9EEF5;--row-hover:#F5F8FC;--ink:#0B1F3A;--muted:#4B5B73;
  --line:#DAE2EC;--line-strong:#7A8BA3;
  --accent:#0C7C80;--accent-hover:#0A6A6E;--on-accent:#FFFFFF;--accent-soft:#DDF1F1;--accent-ink:#0A6468;
  --spark:#8A9AB2;
  --ok:#1E6E44;--ok-soft:#DDF2E6;--warn:#855000;--warn-soft:#FAEBCB;--crit:#B3261E;--crit-soft:#FBE2DF;--info:#1F4E8C;--info-soft:#DDE8F7;
  --focus:#0C7C80;--shadow:0 1px 2px rgba(11,31,58,.06),0 1px 1px rgba(11,31,58,.04);
  --side-bg:#0B1F3A;--side-line:#1B3358;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08121F;--surface:#0E1D33;--surface-2:#15284A;--row-hover:#122340;--ink:#E7EEF8;--muted:#A3B2C8;
    --line:#1F3355;--line-strong:#5F7499;
    --accent:#2CC4BE;--accent-hover:#52D6D0;--on-accent:#04282A;--accent-soft:#0F3A40;--accent-ink:#6FDDD8;
    --spark:#6A7D9B;
    --ok:#72D39C;--ok-soft:#14392A;--warn:#F2C867;--warn-soft:#3B3112;--crit:#F5A59B;--crit-soft:#4A2320;--info:#93B8F2;--info-soft:#192E54;
    --focus:#6FDDD8;--shadow:none;--side-bg:#050E1B;--side-line:#14243F;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F;--surface:#0E1D33;--surface-2:#15284A;--row-hover:#122340;--ink:#E7EEF8;--muted:#A3B2C8;
  --line:#1F3355;--line-strong:#5F7499;
  --accent:#2CC4BE;--accent-hover:#52D6D0;--on-accent:#04282A;--accent-soft:#0F3A40;--accent-ink:#6FDDD8;
  --spark:#6A7D9B;
  --ok:#72D39C;--ok-soft:#14392A;--warn:#F2C867;--warn-soft:#3B3112;--crit:#F5A59B;--crit-soft:#4A2320;--info:#93B8F2;--info-soft:#192E54;
  --focus:#6FDDD8;--shadow:none;--side-bg:#050E1B;--side-line:#14243F;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13.5px;overflow-wrap:anywhere}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 1. Login Page Styling ---------- */
.login-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:32px;width:100%;max-width:420px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px}
.login-brand{display:flex;align-items:center;gap:12px}
.login-title{font-size:18px;font-weight:700;line-height:1.2}
.login-sub{font-size:13px;color:var(--muted)}

/* Continue with Options */
.social-divider{display:flex;align-items:center;text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin-top:2px}
.social-divider::before, .social-divider::after{content:'';flex:1;border-bottom:1px solid var(--line)}
.social-divider span{padding:0 10px;text-transform:uppercase;letter-spacing:.05em}

.social-options{display:flex;flex-direction:column;gap:8px}
.btn-social{appearance:none;display:flex;align-items:center;justify-content:flex-start;gap:12px;width:100%;min-height:42px;padding:8px 16px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s ease}
.btn-social:hover{background:var(--surface-2)}
.btn-social svg{width:20px;height:20px;flex:none}

/* ---------- sidebar ---------- */
.sidebar{position:fixed;top:0;bottom:0;left:0;width:248px;background:var(--side-bg);color:#C5D3E8;display:flex;flex-direction:column;gap:24px;padding:20px 14px;overflow-y:auto;z-index:20}
.sidebar :focus-visible{outline-color:#7DE3D6}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}
.logo{width:40px;height:40px;border-radius:10px;background:#2DD4BF;color:#06302D;display:grid;place-items:center;flex:none}
.logo .ico{width:22px;height:22px}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.brand-name{font-weight:700;color:#FFFFFF;font-size:15px}
.brand-sub{font-size:12.5px;color:#8FA3C2}
.nav-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8FA3C2;padding:0 12px 8px;font-weight:600}
.nav ul{display:flex;flex-direction:column;gap:4px}
.nav-item{appearance:none;width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#C5D3E8;font-weight:600;font-size:14.5px;cursor:pointer;text-align:left;position:relative;min-height:44px}
.nav-item:hover{background:#12294C;color:#FFFFFF}
.nav-item[aria-current="page"]{background:rgba(45,212,191,.14);color:#FFFFFF}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:#2DD4BF}
.nav-item[aria-current="page"] .ico{color:#2DD4BF}
.badge{margin-left:auto;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 7px;border-radius:999px;background:#F5C451;color:#3B2A00;font-size:12.5px;font-weight:700}
.side-foot{margin-top:auto;border-top:1px solid var(--side-line);padding:16px 8px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}
.side-foot-info{display:flex;gap:12px;align-items:center;min-width:0}
.avatar{width:36px;height:36px;border-radius:50%;background:#1B3358;color:#FFFFFF;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side-foot-text{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.side-foot-text strong{color:#FFFFFF;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot-text span{font-size:12.5px;color:#8FA3C2}
.btn-logout{background:none;border:0;color:#8FA3C2;cursor:pointer;padding:4px;border-radius:6px;display:grid;place-items:center}
.btn-logout:hover{color:#FFFFFF;background:#12294C}

/* ---------- main ---------- */
.main{margin-left:248px;min-width:0;min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 32px;background:var(--surface);border-bottom:1px solid var(--line)}
.top-text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 360px}
.page-title{font-size:22px;line-height:1.25;font-weight:700}
.page-title:focus{outline:none}
.page-sub{color:var(--muted);font-size:14px;max-width:72ch}
.top-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.datetime-display{font-weight:600;font-size:13.5px;color:var(--ink);background:var(--surface-2);padding:6px 12px;border-radius:8px;border:1px solid var(--line)}
.content{width:100%;max-width:1240px;margin-inline:auto;padding:24px 32px 56px}
.panel{display:flex;flex-direction:column;gap:20px}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.split-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:stretch}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.section-head{display:flex;flex-direction:column;gap:2px;margin-top:4px}
h2{font-size:17px;line-height:1.3;font-weight:700}
h3{font-size:15px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow)}
.card-head{display:flex;flex-direction:column;gap:4px}

/* ---------- forms and buttons ---------- */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label,.label{font-weight:600;font-size:14px}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
textarea{resize:vertical;min-height:72px}
[aria-invalid="true"]{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit)}
.err{color:var(--crit);font-size:13.5px}
.err:empty{display:none}
.hint{font-size:13.5px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:8px;border:1px solid transparent;font-weight:600;cursor:pointer;text-align:center;line-height:1.2}
.btn .ico{width:18px;height:18px}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--surface);border-color:var(--accent);color:var(--accent-ink)}
.btn-secondary:hover{background:var(--accent-soft)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-small{min-height:36px;padding:4px 12px;font-size:14px}
.refbtn{appearance:none;background:none;border:0;padding:6px 0;font-weight:700;color:var(--accent-ink);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-info{background:var(--info-soft);color:var(--info)}
.pill-crit{background:var(--crit-soft);color:var(--crit)}
.pill-neutral{background:var(--surface-2);color:var(--muted)}

/* ---------- dashboard ---------- */
.greeting-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border-left:4px solid var(--accent)}
.greeting-card h2{font-size:24px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.stats-4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.stat-lbl{font-weight:600;font-size:14.5px;line-height:1.3}
.stat-ico{width:40px;height:40px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.stat-ico .ico{width:22px;height:22px}
.stat-ico.warn{background:var(--warn-soft);color:var(--warn)}
.stat-ico.crit{background:var(--crit-soft);color:var(--crit)}
.stat-ico.ok{background:var(--ok-soft);color:var(--ok)}
.stat-val{font-size:36px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
.stat-unit{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.stat-def{color:var(--muted);font-size:13.5px}
.stat-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.spark{width:120px;height:40px;flex:none}
.spark-line{fill:none;stroke:var(--spark);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark-now{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark-ring{fill:var(--surface)}
.spark-dot{fill:var(--accent)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(110px,150px) minmax(0,1fr) 28px;gap:12px;align-items:center}
.bar-label{font-size:14px}
.bar-track{display:block;height:16px;border-radius:0 4px 4px 0;background:var(--accent-soft)}
.bar-fill{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--accent)}
.bar-val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.activity{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act:first-child{padding-top:0}
.act:last-child{border-bottom:0;padding-bottom:0}
.act-ico{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:grid;place-items:center}
.act-ico .ico{width:18px;height:18px}
.act-body{display:flex;flex-direction:column;min-width:0;font-size:14px}
.act-body .refbtn{padding:0;align-self:flex-start}
.act-body time{font-size:13px;color:var(--muted)}
.ai{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ai label{display:flex;gap:10px;align-items:center;font-weight:500;flex:1 1 280px}
.ai input[type="checkbox"]{width:22px;min-height:22px;height:22px;flex:none;accent-color:var(--accent)}
.ai .done{text-decoration:line-through;color:var(--muted)}

/* ---------- steps, notices ---------- */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface);flex:none}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.step.now .dot{border-color:var(--accent);color:var(--accent-ink)}
.step-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.step-body p{color:var(--muted)}
.step.todo .step-body strong{color:var(--muted)}
.notice{background:var(--surface-2);border-radius:8px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}

/* ---------- booking ---------- */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.day,.slot,.chip{appearance:none;cursor:pointer;border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;min-height:44px;padding:6px 8px;font-weight:600}
.day{display:flex;flex-direction:column;align-items:center;line-height:1.2;font-size:13px}
.day strong{font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.slot small{font-size:12px;font-weight:600}
.day:hover,.slot:hover:not([aria-disabled="true"]),.chip:hover{background:var(--surface-2)}
.day[aria-pressed="true"],.slot[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slot[aria-disabled="true"]{background:var(--surface-2);border-color:var(--surface-2);color:var(--muted);cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cal-col{display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface-2);border-radius:10px;padding:10px}
.cal-col ul{display:flex;flex-direction:column;gap:6px}
.appt{background:var(--surface);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;font-size:13.5px;min-width:0}
.appt small{color:var(--muted)}
.appt.new{outline:2px solid var(--accent)}
.appt .pill{align-self:flex-start;margin-top:4px}
.empty-slot{font-size:13.5px;color:var(--muted);padding:8px 10px}

/* ---------- tracker and tables ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .search{flex:1 1 220px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;min-height:40px;padding:4px 14px;font-weight:600;font-size:14px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.data{width:100%;border-collapse:separate;border-spacing:0;min-width:600px}
table.data thead th{background:var(--surface-2);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:middle;background:var(--surface);white-space:nowrap}
table.data tbody tr:last-child td{border-bottom:0}
table.data tbody tr:hover td{background:var(--row-hover)}
table.data tr.sel td{background:var(--accent-soft)}
table.data tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.num-cell{font-variant-numeric:tabular-nums;text-align:right}
select.st{min-height:38px;padding:4px 10px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid transparent;width:auto}
.st-awaiting-validation{background:var(--info-soft);color:var(--info)}
.st-under-review{background:var(--surface-2);color:var(--ink)}
.st-delayed{background:var(--warn-soft);color:var(--warn)}
.st-refund-requested{background:var(--info-soft);color:var(--info)}
.st-escalated{background:var(--crit-soft);color:var(--crit)}
.st-resolved{background:var(--ok-soft);color:var(--ok)}
.empty{padding:20px;text-align:center;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{overflow-wrap:anywhere}
.history{display:flex;flex-direction:column;gap:8px;font-size:14px}
.history li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.history time{color:var(--muted);font-size:13px}
.divider{border:0;border-top:1px solid var(--line);margin:0}

/* ---------- drive ---------- */
.drive{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.tree{display:flex;flex-direction:column;gap:2px}
.tf-btn,.sub-btn{appearance:none;background:none;border:0;width:100%;text-align:left;cursor:pointer;border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px;min-height:40px}
.tf-btn:hover,.sub-btn:hover{background:var(--surface-2)}
.tf-btn.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.tf-btn .ico{width:16px;height:16px}
.subs{display:flex;flex-direction:column;padding-left:18px;margin-block:2px 6px}
.sub-btn{font-size:14px;min-height:36px}
.sub-btn.on{font-weight:700;color:var(--accent-ink);box-shadow:inset 3px 0 0 var(--accent);border-radius:0 8px 8px 0}
.crumb{color:var(--muted);font-size:14px}
.files{display:flex;flex-direction:column;gap:8px}
.file{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.file .mono{flex:1 1 280px}
.restricted{display:flex;gap:12px;align-items:flex-start;background:var(--crit-soft);color:var(--crit);border-radius:10px;padding:14px 16px}
.restricted .ico{width:22px;height:22px;margin-top:2px}
.restricted p{color:var(--ink)}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tier{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.backup-cats{display:flex;flex-direction:column;gap:16px}
.backup-cat{border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.backup-cat-title{font-size:15px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:6px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;max-width:calc(100vw - 32px);text-align:center;z-index:30}

@media (max-width:1399px){
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1180px){
  .split-even{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){
  .drive{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:960px){
  .sidebar{top:auto;bottom:0;left:0;right:0;width:auto;flex-direction:row;gap:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--side-line);overflow:visible}
  .brand,.nav-label,.side-foot{display:none}
  .nav{width:100%}
  .nav ul{flex-direction:row;gap:2px}
  .nav li{flex:1 1 0;min-width:0}
  .nav-item{flex-direction:column;gap:2px;padding:6px 2px;font-size:12px;line-height:1.15;justify-content:center;text-align:center;min-height:54px}
  .nav-item[aria-current="page"]::before{left:20%;right:20%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .badge{position:absolute;top:2px;left:calc(50% + 6px);margin:0;min-width:18px;height:18px;font-size:11.5px;padding:0 5px}
  .main{margin-left:0;padding-bottom:76px}
  .topbar{padding:14px 16px}
  .content{padding:16px 16px 40px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:620px){
  .fields{grid-template-columns:minmax(0,1fr)}
  .tiers{grid-template-columns:minmax(0,1fr)}
  .history li{grid-template-columns:minmax(0,1fr);gap:2px}
  .card{padding:16px}
  .page-title{font-size:20px}
  .bar-row{grid-template-columns:minmax(96px,120px) minmax(0,1fr) 28px}
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
